services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanat
      POSTGRES_PASSWORD: sanat
      POSTGRES_DB: sanat_tarihi
    ports:
      - "5432:5432"
    volumes:
      - sanat_pgdata:/var/lib/postgresql/data

volumes:
  sanat_pgdata:
